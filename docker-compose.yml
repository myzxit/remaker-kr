# 리메이커 전체 구성: 웹 + 워커.
#
#   AUTH_SECRET=$(openssl rand -base64 32) docker compose up -d --build
#
# 두 컨테이너가 /data 볼륨으로 DB와 영상을 공유한다.
# 영상이 로컬 디스크에 쌓이므로 같은 호스트에 있어야 한다.

services:
  web:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    image: remaker-kr:latest
    command: ["web"]
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET 가 필요합니다. openssl rand -base64 32 로 만드세요}
      AUTH_URL: ${SITE_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # 아래 둘은 선택. 넣으면 해당 도구가 켜진다.
      IMAGE_API_URL: ${IMAGE_API_URL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    image: remaker-kr:latest
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET 가 필요합니다}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
      IMAGE_API_URL: ${IMAGE_API_URL:-}
    volumes:
      - data:/data

volumes:
  data:
